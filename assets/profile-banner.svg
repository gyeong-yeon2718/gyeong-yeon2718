<g font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><text x="82" y="93" fill="#77e0ca" font-size="18" letter-spacing="2">전력전자 · 회로 · 제어</text><text x="78" y="171" fill="#fff" font-size="62" font-weight="700">박경연</text><text x="82" y="226" fill="#e5eef5" font-size="27">회로의 동작을 해석하고,</text><text x="82" y="267" fill="#e5eef5" font-size="27">시스템에서 검증합니다.</text><text x="82" y="313" fill="#a8bdce" font-size="17">한양대학교 전기공학 · 연구 및 프로젝트 포트폴리오</text></g>
